name: CI Pipeline

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  code-quality:
    name: Code Quality (Lint & Type Check)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        # Akan gagal jika ada error linter yang fatal
        run: npm run lint
      
      - name: Run TypeScript type check
        # Mengecek apakah ada error type di TypeScript tanpa membuild
        run: npx tsc --noEmit

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [code-quality]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Next.js
        # Mensimulasikan build untuk memastikan tidak ada error saat kompilasi production
        run: npm run build
      
      - name: Run tests
        # Menjalankan unit test jika ada
        run: npm run test -- --passWithNoTests || true
